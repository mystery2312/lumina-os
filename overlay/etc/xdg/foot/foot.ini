# Terminal LuminaOS : fond noir comme le Terminal de ChromeOS, couleurs
# vives lisibles, police monospace locale.
font=DejaVu Sans Mono:size=10.5
pad=12x10
term=xterm-256color

[cursor]
color=0f1512 85d6bc

[colors]
background=0f1512
foreground=e8eaed
selection-background=3c4043
selection-foreground=ffffff
regular0=0f1512
regular1=f28b82
regular2=85d6bc
regular3=fdd663
regular4=8ab4f8
regular5=c58af9
regular6=78d9ec
regular7=e8eaed
bright0=5f6368
bright1=f6aea9
bright2=a1f2d7
bright3=fde293
bright4=aecbfa
bright5=d7aefb
bright6=a1e4f2
bright7=ffffff

# Barre de titre dessinee par labwc : memes coins arrondis, mesures et
# boutons que les applis LuminaOS, et elle suit le mode clair ou sombre.
[csd]
preferred=server
