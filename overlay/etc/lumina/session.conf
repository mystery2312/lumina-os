# Moteur de rendu du bureau : auto | gles2 | pixman
#   auto   : interroge le GPU a chaque demarrage (vraie acceleration 3D ->
#            gles2, emulation llvmpipe -> pixman) ; bascule aussi en pixman
#            si gles2 plante
#   gles2  : force l'acceleration GPU
#   pixman : rendu logiciel, fonctionne partout, plus gourmand en CPU
LUMINA_RENDERER=auto

# Langue de l'interface (fr, en-US)
LUMINA_LANG=fr

# Disposition du clavier (fr, be, ch, ca, us...)
LUMINA_KEYMAP=fr

# Ouvrir le navigateur a l'ouverture de session (yes/no)
LUMINA_OPEN_BROWSER=yes
