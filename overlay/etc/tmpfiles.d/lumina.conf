# La partition STATE est montee sur /var/lib/lumina et appartient a root
# apres formatage. systemd-tmpfiles retablit les droits a chaque boot,
# donc l'image fonctionne sur un disque neuf sans intervention.
#
# Seul root ecrit a la racine, dans config/ et dans ai/ : des outils
# administrateur y lisent leurs reglages. Si la session en etait proprietaire,
# une appli compromise pourrait les remplacer et obtenir les droits root.
d /var/lib/lumina         0755 root root -
d /var/lib/lumina/config  0755 root root -
d /var/lib/lumina/ai      0755 root root -
d /var/lib/lumina/browser 0700 lumina lumina -
