# La partition STATE est montee sur /var/lib/lumina et appartient a root
# apres formatage. systemd-tmpfiles retablit les droits a chaque boot,
# donc l'image fonctionne sur un disque neuf sans intervention.
d /var/lib/lumina         0755 lumina lumina -
d /var/lib/lumina/browser 0700 lumina lumina -
