# Avec zram, echanger est quasi gratuit (compression en RAM, pas d'I/O
# disque). On pousse donc le noyau a echanger tres agressivement plutot
# qu'a jeter le cache de pages : c'est ce que fait Android Go.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Lecture anticipee de swap desactivee : inutile en RAM, couteuse.
vm.page-cluster = 0
# Le navigateur cree beaucoup de mappings.
vm.max_map_count = 262144
# eMMC lente : on limite les pics d'ecriture qui figent la machine.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
