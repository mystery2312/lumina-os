# Demarrage BIOS de LuminaOS (PC sans UEFI). Pose sur l'ESP (/grub).
# Meme logique A/B que systemd-boot, dans grubenv (a cote) :
#   good=a|b        emplacement valide (dernier demarrage reussi)
#   try=a|b         nouvelle version a essayer ; tries=3|2|1|0 essais
#   uuid_a, uuid_b  PARTUUID des partitions systeme ; extra : options noyau
# Chaque demarrage d'essai decompte un essai. Une fois le bureau lance,
# lumina-boot-ok valide l'emplacement (good=...). Apres 3 echecs, retour
# automatique a l'emplacement valide.
set timeout=0
set timeout_style=hidden
if [ -s $prefix/grubenv ]; then load_env -f $prefix/grubenv; fi
set slot=$good
if [ -n "$try" ]; then
  if   [ "$tries" = 3 ]; then set tries=2; set slot=$try
  elif [ "$tries" = 2 ]; then set tries=1; set slot=$try
  elif [ "$tries" = 1 ]; then set tries=0; set slot=$try
  else set try=; fi
  save_env -f $prefix/grubenv try tries
fi
if [ "$slot" = b ]; then set uuid=$uuid_b; else set slot=a; set uuid=$uuid_a; fi
# Noyau illisible : on redemarre, ce qui decompte un essai (sinon GRUB
# resterait bloque sur son menu).
menuentry "LuminaOS" {
  if linux /lumina-$slot/vmlinuz root=PARTUUID=$uuid rw rootwait quiet loglevel=3 panic=10 splash vt.global_cursor_default=0 rd.udev.log_level=3 rd.systemd.show_status=auto $extra; then
    if initrd /lumina-$slot/initrd.img; then boot; fi
  fi
  sleep 3
  reboot
}
