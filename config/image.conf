# ---- LuminaOS : configuration de l'image -------------------------------
# Tout est en MiB. Les UUID de partition sont FIXES : la ligne de commande
# du noyau y fait reference (root=PARTUUID=...), c'est ce qui rend les
# mises a jour A/B possibles sans toucher au bootloader.

SUITE="trixie"                       # Debian 13
MIRROR="http://deb.debian.org/debian"
ARCH="amd64"
# non-free-firmware : requis pour le Wi-Fi sur du materiel de recup.
COMPONENTS="main,non-free-firmware"
# L'hote est une Ubuntu : son apt ne connait pas les clefs de signature
# Debian. Sans ce trousseau, apt refuse les paquets qu'il ne peut verifier.
# (Le systeme construit, lui, recoit debian-archive-keyring et sera donc
# autonome pour ses propres mises a jour.)
KEYRING="/usr/share/keyrings/debian-archive-keyring.gpg"
FIRMWARE="${FIRMWARE:-1}"           # 0 = image 100% libre
HOSTNAME="lumina"

# Version de l'image, ecrite dans /etc/lumina/version. Les mises a jour
# comparent ces numeros : ils doivent croitre (annee.mois.jour.heureminute).
VERSION="${LUMINA_VERSION:-$(date -u +%Y.%m.%d.%H%M)}"

# DEV=1 : image de developpement (mot de passe root "lumina", console de
# secours sur Alt+F2). DEV=0 : image a publier, sans aucun acces root.
DEV="${DEV:-1}"

# Adresse des mises a jour : le fichier manifest.txt de la derniere Release
# GitHub. Remplacable par /var/lib/lumina/config/update.conf (tests).
UPDATE_URL="https://github.com/mystery2312/lumina-os/releases/latest/download/manifest.txt"

# Profil materiel : lite (2 Go) | standard (4 Go) | full (8 Go)
PROFILE="${PROFILE:-lite}"

# Disposition du disque, calquee sur ChromeOS : ESP + 2 racines + etat
ESP_MB=128
ROOT_MB=3072                         # x2 (A et B)
# L'image pour cle USB ne contient que ESP + ROOT-A + une petite partition
# d'etat (~3,4 Go a ecrire au lieu de 10). Au premier demarrage,
# lumina-grow cree ROOT-B a la fin de la cle et agrandit l'etat.
STATE_IMG_MB=256

UUID_ESP="11111111-1111-1111-1111-111111111111"
UUID_ROOT_A="22222222-2222-2222-2222-222222222222"
UUID_ROOT_B="33333333-3333-3333-3333-333333333333"
UUID_STATE="44444444-4444-4444-4444-444444444444"

# mitigations=off redonne 10-30% de CPU sur un Atom/Core2, au prix de la
# protection Spectre/Meltdown. Desactive par defaut : a toi de trancher.
KERNEL_CMDLINE_EXTRA="${KERNEL_CMDLINE_EXTRA:-}"

# root    : utilise sudo, sortie en repertoire. Plus simple a inspecter
#           et a deboguer, mais la chaine tourne avec les pleins pouvoirs.
# unshare : aucun privilege, sortie en archive. Plus sur, un peu plus
#           indirect (le namespace n'a pas acces a $HOME).
BUILD_MODE="${BUILD_MODE:-root}"

ROOTFS_DIR="out/rootfs"
ROOTFS_TAR="out/rootfs.tar"
IMAGE="out/lumina-${PROFILE}.img"
